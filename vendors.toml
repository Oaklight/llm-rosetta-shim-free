# ---------------------------------------------------------------------------
# Moved out of llm-rosetta core (Oaklight/llm-rosetta#1660 S7).  The trees are
# copied unchanged from core master 0585e6010b, so every shim keeps its name.
#
# `tier:paid` here means "needs a keyed account"; some of these accounts carry
# a free allowance (groq, nvidia, modelscope), but `tier:free` is kept for the
# keyless pools above, which the legacy `free` preset selects.
# `region:cn` marks a vendor whose default endpoint is the mainland-China one.
#
# Permanently in contrib (aggregators, subscription and sign-in lanes).  Each
# is `beta`: core's tests come with it, and `since` is the latest dated live
# record in the vendor's own files unless the comment says otherwise.

# Go (monthly subscription) and Zen (account balance) share one key; the Go
# allowance probe is quota.py.  Probed live 2026-10-13 (llm/messages); about
# 99k production requests 2026-10-11..2026-11-21 (#1660 usage evidence).
[vendors.opencode]
version = "0.5.0"
maturity = "beta"
since = "2026-10-13"
tags = ["tier:subscription", "tier:paid"]

