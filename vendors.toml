# Model makers' own APIs with a static key: `stable` and eligible for
# promotion into core (#1660 "Placement"); `since` is the placement decision.
# zhipu, xai, qwen and moonshot keep their bare chat shim names (`zhipu`,
# `xai`, `qwen`, `moonshot`): a manifest shim name is the vendor key,
# `<vendor>--<name>` or `<vendor>_<lane>--<name>`, owned by the longest vendor
# key of this manifest it matches (core's manifest rule, #1660 S7).
# minimax stays in core as the reference vendor of its embeddings format.

